name: Trading validation
on:
  pull_request:
  push:
    branches: [main, v5, feat/neon-arena-arcade-pop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trading-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:trading
